<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Montserrat', sans-serif; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2C3E50 0%, #34495E 50%, #2C3E50 100%);
      color: #ECF0F1;
      text-align: center;
      overflow: hidden;
      position: relative;
      animation: bgAnimation 10s ease infinite;
    }

    @keyframes bgAnimation {
      0%,100% { background: linear-gradient(135deg, #2C3E50 0%, #34495E 50%, #2C3E50 100%); }
      50% { background: linear-gradient(135deg, #34495E 0%, #2C3E50 50%, #34495E 100%); }
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: 0.4;
      background: #ECF0F1;
      animation: float 8s ease-in-out infinite;
    }
    .bubble:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 20%; animation-duration: 7s; }
    .bubble:nth-child(2) { width: 80px; height: 80px; top: 60%; left: 15%; animation-duration: 10s; }
    .bubble:nth-child(3) { width: 100px; height: 100px; top: 50%; left: 80%; animation-duration: 9s; }
    .bubble:nth-child(4) { width: 60px; height: 60px; top: 20%; left: 70%; animation-duration: 6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-20px) translateX(10px); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 400px;
      padding: 2rem;
      background: rgba(44, 62, 80, 0.7);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 1.2s ease-out;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      animation: fadeIn 1s ease-out 0.5s both;
    }

    p {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      animation: fadeIn 1s ease-out 0.7s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .subscribe input[type="email"] {
      width: 70%;
      padding: 0.8rem;
      border: none;
      border-radius: 4px 0 0 4px;
      outline: none;
      background: #ECF0F1;
      color: #2C3E50;
      animation: fadeIn 1s ease-out 0.9s both;
    }

    .subscribe button {
      padding: 0.8rem 1rem;
      border: none;
      background: #ECF0F1;
      color: #2C3E50;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      transition: background 0.3s;
      animation: fadeIn 1s ease-out 1.1s both;
    }
    .subscribe button:hover {
      background: #F2F3F4;
    }

    .footer {
      position: absolute;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
      animation: fadeIn 1s ease-out 1.3s both;
    }
  </style>
</head>
<body>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="content">
    <h1>We're Launching Soon!</h1>
    <p>Yes, we will soon hit your email once we are live.</p>
    <form id="subscribe-form" class="subscribe">
      <input type="text" name="website" style="display:none">
      <input type="email" name="email" placeholder="Enter your email" required>
      <button type="submit">Notify Me</button>
      <p id="msg" style="margin-top:1rem; font-size:0.9rem; display:none;"></p>
    </form>
  </div>

  <div class="footer">© 2025 Rohan Batra. All rights reserved.</div>

  <script>
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1368869888323616839/Rn6SVFsbxllyX7pXM20KqWvamTeyhr5N6pqQeURYS1WDEAN60u2mWV0PMYNR7vBEVCTG';

    document.getElementById('subscribe-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      if (form.website.value) return; // bot detected
      const email = form.email.value;
      try {
        const leadRes = await fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: `📬 New subscriber: **${email}**` })
        });

        if (leadRes.ok) {
          document.getElementById('msg').textContent = 'Thanks! We\'ll keep you posted.';
        } else {
          document.getElementById('msg').textContent = 'Yes, we will soon hit your email once we are live.';
        }
        document.getElementById('msg').style.display = 'block';
        form.email.value = '';
      } catch (err) {
        console.error(err);
        document.getElementById('msg').textContent = 'Oops! Something went wrong.';
        document.getElementById('msg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
