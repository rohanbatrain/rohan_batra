<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rohan Batra</title>
  <meta name="description" content="Choose to visit Portfolio or Blog of Rohan Batra." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0f172a;
      --fg-light: #ffffff;
      --accent: #38bdf8;
      --muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at top, #0f172a, #020617);
      color: var(--fg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease-out 0.2s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--muted);
      font-size: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .link-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.5rem 2.5rem;
      border-radius: 1rem;
      text-decoration: none;
      color: var(--fg-light);
      font-weight: 600;
      font-size: 1.125rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .link-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.25rem; }
      .link-card {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hey there 👋</h1>
    <p>Where would you like to go?</p>
    <div class="links">
      <a class="link-card" href="https://portfolio.rohanbatra.in">View Dev Portfolio</a>
      <a class="link-card" href="https://rohanbatra.in/blog">Visit Blog</a>
    </div>
    <footer>
      &copy; 2025 Rohan Batra — rohanbatra.in
    </footer>
  </div>
</body>
</html>
