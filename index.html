  <style>
    :root {
      --bg-dark: #0f172a;
      --fg-light: #ffffff;
      --accent: #38bdf8;
      --muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at top, #0f172a, #020617);
      color: var(--fg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .container {}

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--muted);
      font-size: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .link-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.5rem 2.5rem;
      border-radius: 1rem;
      text-decoration: none;
      color: var(--fg-light);
      font-weight: 600;
      font-size: 1.125rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .link-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
    }

    .invisible-h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.25rem; }
      .link-card {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <h1 class="invisible-h1">Rohan Batra | Developer, Writer & Linux Researcher - Official Portfolio & Blog</h1>
  <main class="container" role="main">

    <p>Where would you like to go?</p>

      <a class="link-card" href="https://rohanbatra.in/blog" aria-label="Technical Blog">Visit Blog</a>
    </nav>
    <footer>
      &copy; 2025 Rohan Batra — <a href="https://rohanbatra.in" style="color:inherit;">rohanbatra.in</a>
    </footer>
  </main>
</body>
