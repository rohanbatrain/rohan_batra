name: Unified Release - Rohan Batra

on:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Extract release version
        id: extract_version
        run: |
          VERSION=$(echo ${GITHUB_REF} | sed 's/refs\/heads\///')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build Linux
        run: flutter build linux --release
      - name: Create tar.gz archive for Linux executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Linux-x86-64-${{ steps.extract_version.outputs.version }}.tar.gz" -C build/linux/x64/release bundle
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v3
        with:
          name: linux-artifact
          path: release/Rohan-Batra-Linux-x86-64-*.tar.gz

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Create tar.gz archive for Windows executable
        shell: bash
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Windows-x86-64-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/windows/x64/runner/Release .
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-artifact
          path: release/Rohan-Batra-Windows-x86-64-*.tar.gz

  build-macos:
    runs-on: macos-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Create tar.gz archive for macOS executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-macOS-x86-64-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/macos/Build/Products/Release .
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v3
        with:
          name: macos-artifact
          path: release/Rohan-Batra-macOS-x86-64-*.tar.gz

  build-web-android:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Rename APK and AAB for Release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rohan-Batra.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Rohan-Batra.aab
      - name: Build Web
        run: |
          flutter config --enable-web
          flutter build web --release
      - name: Create tar.gz archive for Web build
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Web-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/web .
      - name: Upload Web/Android Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-android-artifact
          path: |
            release/Rohan-Batra-Web-*.tar.gz
            build/app/outputs/bundle/release/Rohan-Batra.aab
            build/app/outputs/flutter-apk/Rohan-Batra.apk

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-web-android]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts
      - name: Move all release files to a single directory
        run: |
          mkdir -p release
          find ./artifacts -type f -name '*.tar.gz' -exec mv {} release/ \;
          find ./artifacts -type f -name '*.aab' -exec mv {} release/ \;
          find ./artifacts -type f -name '*.apk' -exec mv {} release/ \;
      - name: Create GitHub Release
        run: |
          VERSION=${{ needs.build-linux.outputs.version }}
          gh release create $VERSION \
            release/Rohan-Batra-Linux-x86-64-$VERSION.tar.gz \
            release/Rohan-Batra-Web-$VERSION.tar.gz \
            release/Rohan-Batra-Windows-x86-64-$VERSION.tar.gz \
            release/Rohan-Batra-macOS-x86-64-$VERSION.tar.gz \
            release/Rohan-Batra.aab \
            release/Rohan-Batra.apk \
            --title "Release $VERSION" \
            --notes "Release $VERSION for branch $GITHUB_REF" \
            --repo $GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }}
      - name: Push Release Artifacts to rohan_batra_releases
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          rm -rf rohan_batra_releases
          git clone https://x-access-token:${{ secrets.GH_SECRET }}@github.com/rohanbatrain/rohan_batra_releases.git
          cd rohan_batra_releases
          mkdir -p $VERSION
          cp ../release/*$VERSION*.tar.gz $VERSION/ || true
          cp ../release/Rohan-Batra.aab $VERSION/ || true
          cp ../release/Rohan-Batra.apk $VERSION/ || true
          git add .
          git commit -m "Add release artifacts for $VERSION" || echo "Nothing to commit"
          git push origin main
        env:
          GH_SECRET: ${{ secrets.GH_SECRET }}
