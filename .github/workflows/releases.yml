name: Unified Release - Rohan Batra

on:
  push:
    branches:
      - main

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start Pipeline
        run: echo "Starting all builds in parallel."

  build-linux:
    runs-on: ubuntu-latest
    needs: start
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: linux-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            linux-flutter-
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install GTK dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Extract release version
        id: extract_version
        run: |
          VERSION=$(echo ${GITHUB_REF} | sed 's/refs\/heads\///')
          # Fallback if GITHUB_REF doesn't provide a clean version (e.g., if triggered manually without a branch name)
          if [ -z "$VERSION" ]; then
            VERSION="v$(date +%Y%m%d%H%M%S)" # Example: v20231027153045
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build Linux
        run: flutter build linux --release
      - name: Create tar.gz archive for Linux executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Linux-x86-64-${{ steps.extract_version.outputs.version }}.tar.gz" -C build/linux/x64/release bundle
      - name: Install appimagetool
        run: |
          mkdir -p appimage
          if [ ! -f "./appimage/appimagetool-x86_64.AppImage" ]; then
            wget -O ./appimage/appimagetool-x86_64.AppImage "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x ./appimage/appimagetool-x86_64.AppImage
          fi
      - name: Prepare AppDir
        run: |
          mkdir -p appimage/Rohan-Batra.AppDir
          cp -r ./build/linux/x64/release/bundle/* ./appimage/Rohan-Batra.AppDir/
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimage/appimagetool-x86_64.AppImage ./appimage/Rohan-Batra.AppDir ./appimage/Rohan-Batra.AppImage
          mkdir -p release
          mv ./appimage/Rohan-Batra.AppImage release/Rohan-Batra-${{ steps.extract_version.outputs.version }}.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-artifact
          path: release/Rohan-Batra-*.AppImage
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: release/Rohan-Batra-Linux-x86-64-*.tar.gz

  build-windows:
    runs-on: windows-latest
    needs: start
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: windows-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            windows-flutter-
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Create tar.gz archive for Windows executable
        shell: bash
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Windows-x86-64-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/windows/x64/runner/Release .
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: release/Rohan-Batra-Windows-x86-64-*.tar.gz

  build-macos:
    runs-on: macos-latest
    needs: start
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: macos-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            macos-flutter-
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Create tar.gz archive for macOS executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-macOS-x86-64-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/macos/Build/Products/Release .
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: release/Rohan-Batra-macOS-x86-64-*.tar.gz

  build-ios:
    runs-on: macos-latest
    needs: start
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ios-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ios-flutter-
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --no-codesign --release
      - name: Create .ipa archive for iOS
        run: |
          mkdir -p release
          # The IPA will be in build/ios/iphoneos, and it's named Runner.app. We need to package it correctly.
          # For unsigned builds, you often get a Runner.app directory.
          # To create an IPA, you typically compress the .app directory into a .ipa file.
          # Note: This .ipa will be unsigned and cannot be directly installed on devices without manual signing.
          ditto -ck --rsrc --arch x86_64 build/ios/iphoneos/Runner.app release/Rohan-Batra-iOS-x86-64-${{ needs.build-linux.outputs.version }}.ipa
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: release/Rohan-Batra-iOS-x86-64-*.ipa

  build-apk:
    runs-on: ubuntu-latest
    needs: start
    steps:
      - name: Cache Android SDK and NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/sdk
            /usr/local/lib/android/sdk/ndk
          key: android-sdk-ndk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: apk-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            apk-flutter-
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK for Release
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rohan-Batra.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: build/app/outputs/flutter-apk/Rohan-Batra.apk

  build-aab:
    runs-on: ubuntu-latest
    needs: start
    steps:
      - name: Cache Android SDK and NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/sdk
            /usr/local/lib/android/sdk/ndk
          key: android-sdk-ndk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: aab-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            aab-flutter-
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build AAB
        run: flutter build appbundle --release
      - name: Rename AAB for Release
        run: mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Rohan-Batra.aab
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-artifact
          path: build/app/outputs/bundle/release/Rohan-Batra.aab

  build-web:
    runs-on: ubuntu-latest
    needs: start
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: web-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            web-flutter-
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Enable Web for Flutter
        run: flutter config --enable-web
      - name: Build Web
        run: flutter build web --release
      - name: Create tar.gz archive for Web build
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Web-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/web .
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: release/Rohan-Batra-Web-*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-ios, build-apk, build-aab, build-web] # Added build-ios
    steps:
      - name: Set Release Version
        id: set_version
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Check if Release Exists and Delete if it does
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release '$VERSION' already exists. Deleting..."
            gh release delete "$VERSION" --yes --repo "$GITHUB_REPOSITORY"
          else
            echo "Release '$VERSION' does not exist. Proceeding with creation."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use default GITHUB_TOKEN for current repo operations

      - name: Download all artifacts to a single directory
        uses: actions/download-artifact@v4
        with:
          path: ./release
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          FILES=$(find release -type f -print | tr '\n' ' ')

          if [ -z "$FILES" ]; then
            echo "Error: No release files found to create a GitHub release."
            exit 1
          fi

          echo "Attempting to create GitHub release with files: $FILES"

          gh release create "$VERSION" $FILES \
            --title "Release $VERSION" \
            --notes "Release $VERSION for branch $GITHUB_REF" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Artifacts to rohan_batra_releases
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Clone the release repository
          git clone "https://x-access-token:${{ secrets.GH_SECRET }}@github.com/rohanbatrain/rohan_batra_releases.git" rohan_batra_releases_repo
          cd rohan_batra_releases_repo
          
          mkdir -p "$VERSION"
          cp -r ../release/* "$VERSION"/ || true

          git add .
          git commit -m "Add release artifacts for $VERSION" || echo "Nothing to commit"
          git push origin main
        env:
          GH_SECRET: ${{ secrets.GH_SECRET }}
