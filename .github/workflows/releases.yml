name: Unified Release - Rohan Batra

on:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install GTK dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Extract release version
        id: extract_version
        run: |
          VERSION=$(echo ${GITHUB_REF} | sed 's/refs\/heads\///')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build Linux
        run: flutter build linux --release
      - name: Create tar.gz archive for Linux executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Linux-x86-64-${{ steps.extract_version.outputs.version }}.tar.gz" -C build/linux/x64/release bundle
      - name: Install appimagetool
        run: |
          mkdir -p appimage
          if [ ! -f "./appimage/appimagetool-x86_64.AppImage" ]; then
            wget -O ./appimage/appimagetool-x86_64.AppImage "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x ./appimage/appimagetool-x86_64.AppImage
          fi
      - name: Prepare AppDir
        run: |
          mkdir -p appimage/Rohan-Batra.AppDir
          cp -r ./build/linux/x64/release/bundle/* ./appimage/Rohan-Batra.AppDir/
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimage/appimagetool-x86_64.AppImage ./appimage/Rohan-Batra.AppDir ./appimage/Rohan-Batra.AppImage
          mkdir -p release
          mv ./appimage/Rohan-Batra.AppImage release/Rohan-Batra-${{ steps.extract_version.outputs.version }}.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-artifact
          path: release/Rohan-Batra-*.AppImage
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: release/Rohan-Batra-Linux-x86-64-*.tar.gz

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Create tar.gz archive for Windows executable
        shell: bash
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Windows-x86-64-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/windows/x64/runner/Release .
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: release/Rohan-Batra-Windows-x86-64-*.tar.gz

  build-macos:
    runs-on: macos-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Create tar.gz archive for macOS executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-macOS-x86-64-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/macos/Build/Products/Release .
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: release/Rohan-Batra-macOS-x86-64-*.tar.gz

  build-apk:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK for Release
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rohan-Batra.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: build/app/outputs/flutter-apk/Rohan-Batra.apk

  build-aab:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Rename AAB for Release
        run: mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Rohan-Batra.aab
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-artifact
          path: build/app/outputs/bundle/release/Rohan-Batra.aab

  build-web:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Enable Web for Flutter
        run: flutter config --enable-web
      - name: Build Web
        run: flutter build web --release
      - name: Create tar.gz archive for Web build
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Web-${{ needs.build-linux.outputs.version }}.tar.gz" -C build/web .
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: release/Rohan-Batra-Web-*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-apk, build-aab, build-web]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts
      - name: Move all release files to a single directory
        run: |
          mkdir -p release
          find ./artifacts -type f -name '*.tar.gz' -exec mv {} release/ \;
          find ./artifacts -type f -name '*.aab' -exec mv {} release/ \;
          find ./artifacts -type f -name '*.apk' -exec mv {} release/ \;
          find ./artifacts -type f -name '*.AppImage' -exec mv {} release/ \;
      - name: Create GitHub Release
        run: |
          VERSION=${{ needs.build-linux.outputs.version }}
          gh release create $VERSION \
            release/Rohan-Batra-Linux-x86-64-$VERSION.tar.gz \
            release/Rohan-Batra-Web-$VERSION.tar.gz \
            release/Rohan-Batra-Windows-x86-64-$VERSION.tar.gz \
            release/Rohan-Batra-macOS-x86-64-$VERSION.tar.gz \
            release/Rohan-Batra.aab \
            release/Rohan-Batra.apk \
            release/Rohan-Batra-$VERSION.AppImage \
            --title "Release $VERSION" \
            --notes "Release $VERSION for branch $GITHUB_REF" \
            --repo $GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }}
      - name: Push Release Artifacts to rohan_batra_releases
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          rm -rf rohan_batra_releases
          git clone https://x-access-token:${{ secrets.GH_SECRET }}@github.com/rohanbatrain/rohan_batra_releases.git
          cd rohan_batra_releases
          mkdir -p $VERSION
          cp ../release/*$VERSION*.tar.gz $VERSION/ || true
          cp ../release/Rohan-Batra.aab $VERSION/ || true
          cp ../release/Rohan-Batra.apk $VERSION/ || true
          cp ../release/Rohan-Batra-$VERSION.AppImage $VERSION/ || true
          git add .
          git commit -m "Add release artifacts for $VERSION" || echo "Nothing to commit"
          git push origin main
        env:
          GH_SECRET: ${{ secrets.GH_SECRET }}
