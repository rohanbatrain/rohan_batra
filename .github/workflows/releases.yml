name: Unified Release - Rohan Batra

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Determine the Release Version
  # This job runs first to ensure a consistent version string is generated
  # and used across all subsequent build and release jobs.
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Extract Release Version
        id: extract_version
        run: |
          # Use GITHUB_REF_NAME directly for the branch name (e.g., 'main')
          VERSION="${GITHUB_REF_NAME}"
          # Fallback if GITHUB_REF_NAME is empty (e.g., in edge cases or manual triggers without a branch)
          if [ -z "$VERSION" ]; then
            VERSION="v$(date +%Y%m%d%H%M%S)" # Example: v20250604211432
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined release version: $VERSION"

  ---

  # Parallel Build Jobs:
  # These jobs now run in parallel, all depending on 'get-version'
  # to get the consistent release version.

  build-linux:
    runs-on: ubuntu-latest
    needs: get-version # Depends on 'get-version' to obtain the release string
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: linux-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            linux-flutter-
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install GTK Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Install Dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Create tar.gz archive for Linux executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Linux-x86-64-${{ needs.get-version.outputs.version }}.tar.gz" -C build/linux/x64/release bundle
      - name: Install AppImageTool
        run: |
          mkdir -p appimage
          if [ ! -f "./appimage/appimagetool-x86_64.AppImage" ]; then
            wget -O ./appimage/appimagetool-x86_64.AppImage "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x ./appimage/appimagetool-x86_64.AppImage
          fi
      - name: Prepare AppDir
        run: |
          mkdir -p appimage/Rohan-Batra.AppDir
          cp -r ./build/linux/x64/release/bundle/* ./appimage/Rohan-Batra.AppDir/
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimage/appimagetool-x86_64.AppImage ./appimage/Rohan-Batra.AppDir ./appimage/Rohan-Batra-${{ needs.get-version.outputs.version }}.AppImage
          mkdir -p release
          mv ./appimage/Rohan-Batra-${{ needs.get-version.outputs.version }}.AppImage release/Rohan-Batra-${{ needs.get-version.outputs.version }}.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-artifact
          path: release/Rohan-Batra-*.AppImage
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: release/Rohan-Batra-Linux-x86-64-*.tar.gz

  build-windows:
    runs-on: windows-latest
    needs: get-version # Depends on 'get-version'
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: windows-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            windows-flutter-
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install Dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Create tar.gz archive for Windows executable
        shell: bash
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Windows-x86-64-${{ needs.get-version.outputs.version }}.tar.gz" -C build/windows/x64/runner/Release .
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: release/Rohan-Batra-Windows-x86-64-*.tar.gz

  build-macos:
    runs-on: macos-latest
    needs: get-version # Depends on 'get-version'
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: macos-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            macos-flutter-
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install Dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Create tar.gz archive for macOS executable
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-macOS-x86-64-${{ needs.get-version.outputs.version }}.tar.gz" -C build/macos/Build/Products/Release .
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: release/Rohan-Batra-macOS-x86-64-*.tar.gz

  build-ios:
    runs-on: macos-latest
    needs: get-version # Depends on 'get-version'
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ios-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ios-flutter-
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install Dependencies
        run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --no-codesign --release
      - name: Create .ipa archive for iOS
        run: |
          mkdir -p release
          ditto -ck --rsrc --arch x86_64 build/ios/iphoneos/Runner.app release/Rohan-Batra-iOS-x86-64-${{ needs.get-version.outputs.version }}.ipa
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: release/Rohan-Batra-iOS-x86-64-*.ipa

  build-apk:
    runs-on: ubuntu-latest
    needs: get-version # Depends on 'get-version'
    steps:
      - name: Cache Android SDK and NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/sdk
            /usr/local/lib/android/sdk/ndk
          key: android-sdk-ndk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: apk-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            apk-flutter-
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install Dependencies
        run: flutter pub get
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }} # Fallback if not set by flutter-action

      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK for Release
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Rohan-Batra-${{ needs.get-version.outputs.version }}.apk"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: build/app/outputs/flutter-apk/Rohan-Batra-*.apk

  build-aab:
    runs-on: ubuntu-latest
    needs: get-version # Depends on 'get-version'
    steps:
      - name: Cache Android SDK and NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/sdk
            /usr/local/lib/android/sdk/ndk
          key: android-sdk-ndk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: aab-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            aab-flutter-
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install Dependencies
        run: flutter pub get
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }} # Fallback if not set by flutter-action

      - name: Build AAB
        run: flutter build appbundle --release
      - name: Rename AAB for Release
        run: mv build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/Rohan-Batra-${{ needs.get-version.outputs.version }}.aab"
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-artifact
          path: build/app/outputs/bundle/release/Rohan-Batra-*.aab

  build-web:
    runs-on: ubuntu-latest
    needs: get-version # Depends on 'get-version'
    steps:
      - name: Cache Flutter Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: web-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            web-flutter-
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
      - name: Install Dependencies
        run: flutter pub get
      - name: Enable Web for Flutter
        run: flutter config --enable-web
      - name: Build Web
        run: flutter build web --release
      - name: Create tar.gz archive for Web build
        run: |
          mkdir -p release
          tar -czvf "release/Rohan-Batra-Web-${{ needs.get-version.outputs.version }}.tar.gz" -C build/web .
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: release/Rohan-Batra-Web-*.tar.gz

  ---

  # Release Job:
  # This job depends on all build jobs and 'get-version' to ensure all artifacts
  # are ready and the version is known before creating releases.

  release:
    runs-on: ubuntu-latest
    needs: [get-version, build-linux, build-windows, build-macos, build-ios, build-apk, build-aab, build-web]
    steps:
      - name: Set Release Version
        id: set_version
        run: |
          VERSION="${{ needs.get-version.outputs.version }}" # Get the version from the 'get-version' job
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download all artifacts to a single directory
        uses: actions/download-artifact@v4
        with:
          path: ./release
          merge-multiple: true

      - name: Check if Release Exists and Delete if it does (Current Repository)
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release '$VERSION' already exists in current repo. Deleting..."
            gh release delete "$VERSION" --yes --repo "$GITHUB_REPOSITORY"
          else
            echo "Release '$VERSION' does not exist in current repo. Proceeding with creation."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }} # Use your custom secret for repo operations

      - name: Create GitHub Release (Current Repository)
        run: |
          FILES=$(find release -type f -print | tr '\n' ' ')

          if [ -z "$FILES" ]; then
            echo "Error: No release files found to create a GitHub release in the current repository."
            exit 1
          fi

          echo "Attempting to create GitHub release in current repo with files: $FILES"

          gh release create "$VERSION" $FILES \
            --title "Release $VERSION" \
            --notes "Release $VERSION for branch $GITHUB_REF" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }} # Use your custom secret for repo operations

      - name: Check if Release Exists and Delete if it does (rohan_batra_releases)
        run: |
          # Check for existing release in the target repository
          if gh release view "$VERSION" --repo "rohanbatrain/rohan_batra_releases" > /dev/null 2>&1; then
            echo "Release '$VERSION' already exists in rohan_batra_releases. Deleting..."
            gh release delete "$VERSION" --yes --repo "rohanbatrain/rohan_batra_releases"
          else
            echo "Release '$VERSION' does not exist in rohan_batra_releases. Proceeding with creation."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }} # Important: Use a PAT with repo scope for other repos

      - name: Create GitHub Release in rohan_batra_releases
        run: |
          FILES=$(find release -type f -print | tr '\n' ' ')

          if [ -z "$FILES" ]; then
            echo "Error: No release files found to create a GitHub release in rohan_batra_releases."
            exit 1
          fi

          echo "Attempting to create GitHub release in rohan_batra_releases with files: $FILES"

          gh release create "$VERSION" $FILES \
            --title "Release $VERSION" \
            --notes "Release $VERSION for branch $GITHUB_REF" \
            --repo "rohanbatrain/rohan_batra_releases"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }} # Important: Use a PAT with repo scope for other repos
